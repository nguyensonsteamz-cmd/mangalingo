# Builds an UNSIGNED LingoLens.ipa on a macOS runner. Install it on an iPhone from Windows with
# Sideloadly (it signs the app with your free Apple ID; the app then works for 7 days).
name: iOS app (.ipa)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner. If the default cannot be acquired ("capacity constraints"), pick another one.'
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15-intel
          - macos-14
  push:
    branches: [master, main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/assets/**'
      - 'scripts/build-data.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: write # only to publish the IPA as a GitHub Release (no other write access is used)

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 30
    env:
      # the repository's .npmrc points the npm cache at drive D of the developer's Windows PC
      npm_config_cache: /tmp/mangalingo-npm-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (generates the dictionary data first)
        run: npm test

      - name: Build the web UI + dictionary data into the app
        run: npm run build:ios-web

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -o pipefail  # a failed compile must fail the job (the output is piped to tail)
          xcodebuild -project ios/MangaLingo.xcodeproj -target MangaLingo -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/ios/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             LINGOLENS_GOOGLE_IOS_CLIENT_ID="${{ vars.LINGOLENS_GOOGLE_IOS_CLIENT_ID }}" build 2>&1 | tee xcodebuild.log | tail -n 40

      - name: Embed the App Group entitlements (ad-hoc signature; Sideloadly replaces it when it signs with your Apple ID)
        run: |
          APP="ios/build/Release-iphoneos/MangaLingo.app"
          set -o pipefail
          test -d "$APP/PlugIns/LingoLensWidget.appex" || { echo "the widget is missing from the app" | tee -a xcodebuild.log; exit 1; }  # the widget must be inside the app
          {
            set -e
            codesign --force --sign - --entitlements ios/Entitlements/LingoLensWidget.entitlements "$APP/PlugIns/LingoLensWidget.appex"
            codesign --force --sign - --entitlements ios/Entitlements/MangaLingo.entitlements "$APP"
            codesign -d --entitlements :- "$APP" 2>&1 | head -20
          } 2>&1 | tee -a xcodebuild.log

      - name: Package LingoLens.ipa
        run: |
          APP="ios/build/Release-iphoneos/MangaLingo.app"
          test -d "$APP"
          test -x "$APP/MangaLingo"  # the executable must be there (not just the web files)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry LingoLens.ipa Payload
          ls -lh LingoLens.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LingoLens-ipa
          path: LingoLens.ipa
          retention-days: 30

      # A Release keeps the IPA after a re-run and can be downloaded WITHOUT signing in (this repository is public).
      # The IPA is unsigned and contains no secrets; install it with Sideloadly.
      - name: Publish the IPA as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="ios-${RUN_NUMBER}"
          SHORT="${GITHUB_SHA::7}"
          SHA256=$(shasum -a 256 LingoLens.ipa | cut -d' ' -f1)
          gh release create "$TAG" LingoLens.ipa \
            --target "$GITHUB_SHA" \
            --title "iOS build ${RUN_NUMBER} (${SHORT})" \
            --prerelease \
            --notes "Unsigned iOS build of commit ${SHORT}. SHA-256: ${SHA256}. Install with Sideloadly (free Apple ID: the app works for 7 days)."

      # A build that fails publishes its compiler errors as a (public) pre-release, because the Actions log needs a sign-in to read.
      - name: Publish the build log when the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          test -f xcodebuild.log || exit 0
          ERRS=$(grep -E "error:|\*\* BUILD FAILED|fatal error|missing from|codesign" xcodebuild.log | sort -u | head -40)
          gh release create "ios-failed-${RUN_NUMBER}" xcodebuild.log --target "$GITHUB_SHA" --prerelease \
            --title "iOS build ${RUN_NUMBER} FAILED (${GITHUB_SHA::7})" \
            --notes "Compiler errors:
          ${ERRS}"
