# Builds an UNSIGNED LingoLens.ipa on a macOS runner. Install it on an iPhone from Windows with
# Sideloadly (it signs the app with your free Apple ID; the app then works for 7 days).
name: iOS app (.ipa)

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/assets/**'
      - 'scripts/build-data.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # the repository's .npmrc points the npm cache at drive D of the developer's Windows PC
      npm_config_cache: /tmp/mangalingo-npm-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (generates the dictionary data first)
        run: npm test

      - name: Build the web UI + dictionary data into the app
        run: npm run build:ios-web

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the app (unsigned)
        run: |
          set -o pipefail  # a failed compile must fail the job (the output is piped to tail)
          xcodebuild -project ios/MangaLingo.xcodeproj -target MangaLingo -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/ios/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             LINGOLENS_GOOGLE_IOS_CLIENT_ID="${{ vars.LINGOLENS_GOOGLE_IOS_CLIENT_ID }}" build | tail -n 40

      - name: Package LingoLens.ipa
        run: |
          APP="ios/build/Release-iphoneos/MangaLingo.app"
          test -d "$APP"
          test -x "$APP/MangaLingo"  # the executable must be there (not just the web files)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry LingoLens.ipa Payload
          ls -lh LingoLens.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LingoLens-ipa
          path: LingoLens.ipa
          retention-days: 30

  # Runtime evidence for the iOS WebView: does the app:// page support Workers, the Cache API, WASM and the downloaded
  # translation model? The result is recorded, not asserted: a negative answer is information (the model stays disabled on iPhone).
  simulator-probe:
    name: iOS simulator runtime probe
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      npm_config_cache: /tmp/mangalingo-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build the web UI (+ probe page) into the app
        run: npm run build:ios-web
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/MangaLingo.xcodeproj -target MangaLingo -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/ios/build-sim" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 15
      - name: Boot a simulator, launch with -lingolensProbe, collect the evidence
        run: |
          xcrun simctl list devices available | head -30
          UDID=$(xcrun simctl list -j devices available | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s).devices;const rts=Object.keys(j).filter(k=>/iOS/.test(k)).sort();for(const r of rts.reverse()){const d=j[r].find(x=>/iPhone/.test(x.name));if(d){console.log(d.udid);return}}})")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build-sim/Debug-iphonesimulator/MangaLingo.app
          xcrun simctl launch --terminate-running-process "$UDID" app.mangalingo.ios -lingolensProbe | tee launch.log
          DATA=$(xcrun simctl get_app_container "$UDID" app.mangalingo.ios data)
          echo "data container: $DATA"
          for i in $(seq 1 100); do grep -q "LINGOLENS_PROBE done" "$DATA/Documents/probe.log" 2>/dev/null && break; sleep 5; done
          cp "$DATA/Documents/probe.log" probe.log 2>/dev/null || true
          echo "=== second launch (after terminating the app): is the model still on the device? ==="
          xcrun simctl terminate "$UDID" app.mangalingo.ios || true
          sleep 3
          xcrun simctl launch "$UDID" app.mangalingo.ios -lingolensProbe
          for i in $(seq 1 60); do [ "$(grep -c "LINGOLENS_PROBE done" "$DATA/Documents/probe.log" 2>/dev/null)" -ge 2 ] && break; sleep 5; done
          cp "$DATA/Documents/probe.log" probe.log 2>/dev/null || true
          echo "=== probe evidence ==="
          cat probe.log || true
          if ! grep -q "LINGOLENS_PROBE done" probe.log 2>/dev/null; then
            echo "probe did not finish; app log:"
            xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "MangaLingo"' --style compact | tail -60
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-probe
          path: |
            probe.log
            launch.log
          retention-days: 14
