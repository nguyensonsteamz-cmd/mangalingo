name: CI (extension + Android)

# Runs on every push / pull request. No secrets are used; nothing is published or signed.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: TypeScript · unit tests · extension build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # the repository's .npmrc points the npm cache at drive D of the developer's Windows PC
      npm_config_cache: /tmp/lingolens-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (generates the dictionary data first)
        run: npm test
      - name: Production audit (runtime dependencies only; the bundled model runtime is a dev/build dependency)
        run: npm audit --omit=dev --audit-level=high
      - name: Build the Chrome extension
        env:
          LINGOLENS_EXTENSION_PUBLIC_KEY: ${{ vars.LINGOLENS_EXTENSION_PUBLIC_KEY }}
        run: npm run build
      - name: Check the extension bundle (no remote code, runtime + notices present, model NOT bundled)
        run: |
          test -f dist/vendor/ort/ort-wasm-simd-threaded.wasm
          test -f dist/licenses/OPUS-MT-NOTICE.txt
          ! find dist -name '*.onnx' | grep -q .
          ! grep -rl "cdn.jsdelivr.net/npm/onnxruntime" dist/vendor 2>/dev/null
          du -sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: lingolens-extension
          path: dist
          retention-days: 14

  android:
    name: Android debug + release (unsigned) + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      npm_config_cache: /tmp/lingolens-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Generate the dictionary data
        run: node scripts/build-data.mjs --if-missing
      - name: Build the web UI into the app assets
        run: npm run build:mobile
      - name: Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
          ls -l app/build/outputs/apk/debug app/build/outputs/apk/release app/build/outputs/bundle/release
      - name: Release build must not enable WebView remote debugging
        run: |
          grep -n "setWebContentsDebuggingEnabled" android/app/src/main/java/app/mangalingo/MainActivity.kt
          grep -n "FLAG_DEBUGGABLE" android/app/src/main/java/app/mangalingo/MainActivity.kt
      - uses: actions/upload-artifact@v4
        with:
          name: lingolens-android-unsigned
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
