name: CI (extension + Android)

# Runs on every push / pull request. No secrets are used; nothing is signed. Pushes to main also publish the extension zip and the debug APK as GitHub Releases.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: TypeScript · unit tests · extension build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # only to publish the extension zip as a GitHub Release (pushes to main)
    env:
      # the repository's .npmrc points the npm cache at drive D of the developer's Windows PC
      npm_config_cache: /tmp/lingolens-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (generates the dictionary data first)
        run: npm test
      - name: Production audit (runtime dependencies only)
        run: npm audit --omit=dev --audit-level=high
      - name: Build the Chrome extension
        env:
          LINGOLENS_EXTENSION_PUBLIC_KEY: ${{ vars.LINGOLENS_EXTENSION_PUBLIC_KEY }}
        run: npm run build
      - name: Check the extension bundle (no Google Cloud, no sign-in permission, no downloaded model runtime)
        run: |
          test ! -d dist/vendor/ort
          ! find dist -name '*.onnx' | grep -q .
          ! grep -q '"identity"' dist/manifest.json
          ! grep -rl 'translation.googleapis.com' dist --include='*.js' | grep -q .
          du -sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: lingolens-extension
          path: dist
          retention-days: 14
      # Only for pushes to main: the extension as a zip in a GitHub Release (public repository: downloadable without signing in).
      - name: Publish the Chrome extension as a GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          (cd dist && zip -qr ../LingoLens-chrome.zip .)
          SHA256=$(sha256sum LingoLens-chrome.zip | cut -d' ' -f1)
          gh release create "chrome-${RUN_NUMBER}" LingoLens-chrome.zip \
            --target "$GITHUB_SHA" \
            --title "Chrome extension build ${RUN_NUMBER} (${SHORT})" \
            --prerelease \
            --notes "Unzip, then chrome://extensions → Developer mode → Load unpacked. Commit ${SHORT}. SHA-256: ${SHA256}."

  android:
    name: Android debug + release (unsigned) + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only to publish the debug APK as a GitHub Release (pushes to main)
    env:
      npm_config_cache: /tmp/lingolens-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Generate the dictionary data
        run: node scripts/build-data.mjs --if-missing
      - name: Build the web UI into the app assets
        run: npm run build:mobile
      - name: Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
          ls -l app/build/outputs/apk/debug app/build/outputs/apk/release app/build/outputs/bundle/release
      - name: Release build must not enable WebView remote debugging
        run: |
          grep -n "setWebContentsDebuggingEnabled" android/app/src/main/java/app/mangalingo/MainActivity.kt
          grep -n "FLAG_DEBUGGABLE" android/app/src/main/java/app/mangalingo/MainActivity.kt
      - uses: actions/upload-artifact@v4
        with:
          name: lingolens-android-unsigned
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
      # Only for pushes to main: the debug APK as a GitHub Release (public repository: downloadable without signing in).
      - name: Publish the debug APK as a GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          gh release create "android-${RUN_NUMBER}" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Android debug build ${RUN_NUMBER} (${SHORT})" \
            --prerelease \
            --notes "Debug-signed Android APK of commit ${SHORT}. SHA-256: ${SHA256}."
