# XcodeGen spec – the Xcode project is generated on the macOS build machine (GitHub Actions).
name: MangaLingo
options:
  bundleIdPrefix: app.mangalingo
  deploymentTarget:
    iOS: "15.0"
targets:
  MangaLingo:
    type: application
    platform: iOS
    sources:
      - path: MangaLingo
        excludes:
          - web/**
      - path: MangaLingo/web
        type: folder # copied as-is into the app bundle (web UI + dictionary data)
    info:
      path: MangaLingo/Info.plist
      properties:
        CFBundleDisplayName: MangaLingo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mangalingo.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
