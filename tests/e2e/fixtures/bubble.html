<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; background: #fff; }
      .page { position: relative; width: 760px; height: 560px; background: repeating-linear-gradient(45deg, #f4f4f4 0 6px, #ffffff 6px 12px); }
      .bubble {
        position: absolute; background: #fff; border: 3px solid #111; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: "Comic Sans MS", "Segoe Print", sans-serif; font-weight: bold; color: #111;
        text-transform: uppercase; line-height: 1.15;
      }
      .b1 { left: 40px; top: 40px; width: 330px; height: 190px; font-size: 26px; }
      .b2 { left: 400px; top: 260px; width: 320px; height: 200px; font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="page" id="page">
      <div class="bubble b1"><div>I'M GONNA<br />BECOME THE<br />STRONGEST NINJA!</div></div>
      <div class="bubble b2"><div>WHAT THE HELL<br />IS GOING ON<br />HERE?!</div></div>
    </div>
  </body>
</html>
