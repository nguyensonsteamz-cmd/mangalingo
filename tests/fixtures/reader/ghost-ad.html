<html><head><meta charset="utf-8"><title>Ghost ad page</title>
<style>body{margin:0;font:18px sans-serif} #p1{padding:40px} #ghost{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:99999;opacity:0;background:#000}

<div id="ghost"></div>
